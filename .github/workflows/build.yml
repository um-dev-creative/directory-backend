name: SonarQube
on:
  push:
    branches:
      - main
      - development
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 25 ]
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 25
        uses: actions/setup-java@v4.7.1
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu' # Alternative distribution options are available.
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Check SonarCloud token
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning title=SonarCloud analysis skipped::SONAR_TOKEN is not available (secret not configured, or a pull request from a fork). Tests still run; only the analysis is skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          valid=$(curl -s -u "$SONAR_TOKEN:" https://sonarcloud.io/api/authentication/validate | grep -o '"valid":[a-z]*' || true)
          if [ "$valid" != '"valid":true' ]; then
            echo "::error title=SONAR_TOKEN rejected by SonarCloud::The SONAR_TOKEN secret is expired, revoked or invalid. Generate a new token at SonarCloud (My Account > Security) and update the repository secret SONAR_TOKEN."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Build and test (no analysis)
        if: steps.sonar.outputs.enabled != 'true'
        run: mvn -B verify
      - name: Build and analyze
        if: steps.sonar.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.9.0.7382:sonar
          -Dsonar.projectKey=umdc-directory-backend
          -Dsonar.organization=umdevc
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
