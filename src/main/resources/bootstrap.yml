# This is the main configuration file for the application.
# It uses the YAML format for easier readability and nested configuration.
log:
  debug: ${LOGGING_TRACE_ENABLED}
# Application specific configurations
umdc:
  # The version of the application
  app:
    name: directory-backend
    description: Directory Backend Service
    title: Directory Backend Service
    version: 0.0.1
  management:
    clientRoles: ${APP_CLIENT_ROLES}
  # Base path the session interceptor (security-oauth's SessionJwtInterceptor) protects; SessionTokenSecurityConfig opens the same path
  api:
    endpoint: /api/v1
  logging:
    trace:
      enabled: ${LOGGING_TRACE_ENABLED}
  database-cert: db-root-cert
  # Swagger UI and api-docs: closed unless UMDC_DOCS_ENABLED=true or the profile is dev (see the last document of this file)
  docs:
    enabled: ${UMDC_DOCS_ENABLED:false}
  # Rate limiting of the API (in-memory token buckets; one bucket per client IP and one per user id)
  ratelimit:
    enabled: ${UMDC_RATELIMIT_ENABLED:true}
    ip-per-minute: ${UMDC_RATELIMIT_IP_PER_MINUTE:120}
    user-per-minute: ${UMDC_RATELIMIT_USER_PER_MINUTE:300}
    # true only behind a trusted reverse proxy that sets X-Forwarded-For
    trust-forwarded-header: ${UMDC_RATELIMIT_TRUST_FORWARDED:false}
  security:
    jwt:
      secret: ${APP_TOKEN_SECRET}
      expirationMs: ${APP_TOKEN_EXPIRATION}
    # Read by HttpClientConfig (inter-service RestTemplate). Same place as the TLS bundle's truststore below.
    truststore:
      location: ${SSL_TRUSTSTORE_URL:classpath:${SSL_TRUSTSTORE_LOCATION}}
      password: ${SSL_TRUSTSTORE_PASSWORD}
      type: ${SSL_TRUSTSTORE_TYPE}
    auth:
      clients:
        - id: backbone
          authorization-grant-type: ${BACKBONE_GRANT_TYPE}
          scope: ${BACKBONE_SCOPE}
          client-secret: ${BACKBONE_CLIENT_SECRET}
          client-id: ${BACKBONE_CLIENT_ID}
          redirect-uri: ${AUTH_SERVER_URI}${AUTH_TOKEN_URI}
          username: ${BACKBONE_USERNAME}
          password: ${BACKBONE_PASSWORD}
        - id: mercury
          authorization-grant-type: ${MERCURY_GRANT_TYPE}
          scope: ${MERCURY_SCOPE}
          client-secret: ${MERCURY_CLIENT_SECRET}
          client-id: ${MERCURY_CLIENT_ID}
          redirect-uri: ${AUTH_SERVER_URI}${AUTH_TOKEN_URI}
          username: ${MERCURY_USERNAME}
          password: ${MERCURY_PASSWORD}
  clients:
    mercury:
      # Directory's Backbone managed client. Its Backbone M2M token is what proves to Mercury which application is calling: Mercury
      # trades it (POST /api/v1/auth/token) for its own token, tied to the application Backbone links the client to. Mercury does not
      # accept an alias and a password. The client needs the scopes below in Backbone. Both from Vault.
      m2m:
        client-id: ${MERCURY_M2M_CLIENT_ID:}
        client-secret: ${MERCURY_M2M_CLIENT_SECRET:}
        scopes: ${MERCURY_M2M_SCOPES:mercury:message:read,mercury:message:write}
app:
  # The name of the application
  name: directory-backend
# Spring Boot specific configurations
# Server specific configurations
server:
  port: ${APP_PORT}
  ssl:
    # Enables SSL for the server
    enabled: true
    # The SSL bundle for the server
    bundle: directory-security
    enabled-protocols: TLSv1.3
    compression:
      enabled: true
      mime-types: text/html,text/xml,text/plain,text/css,application/json
      min-response-size: 1024

spring:
  config:
    # Versions the startup banner prints (src/main/resources/build-versions.properties, filtered by Maven)
    import: "optional:classpath:build-versions.properties"
  ssl:
    # SSL_KEYSTORE_URL / SSL_TRUSTSTORE_URL (optional, with a scheme, e.g. file:/usr/local/runme/certs/directory/directory-rest.jks) override the
    # classpath names: the jar carries the keystores (pom.xml, certs/directory), a mounted path wins when set.
    bundle:
      jks:
        directory-security:
          keystore:
            location: ${SSL_KEYSTORE_URL:classpath:${SSL_KEYSTORE_LOCATION}}
            password: ${SSL_KEYSTORE_PASSWORD}
            type: ${SSL_KEYSTORE_TYPE}
          truststore:
            location: ${SSL_TRUSTSTORE_URL:classpath:${SSL_TRUSTSTORE_LOCATION}}
            password: ${SSL_TRUSTSTORE_PASSWORD}
            type: ${SSL_TRUSTSTORE_TYPE}
  mvc:
    throw-exception-if-no-handler-found: true
  autoconfigure:
    # Authentication is the library's SessionJwtInterceptor (see SessionTokenSecurityConfig), not a Keycloak-style resource server
    exclude:
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.web.OAuth2ResourceServerWebSecurityAutoConfiguration
  mustache:
    check-template-location: false
  # Flyway is OFF by default: V2-V5 were applied by hand in every environment. Enable with SPRING_FLYWAY_ENABLED=true
  # (docs/technical/f0-platform.md). baseline-version=5 marks the existing schema as already at V5; V6 onwards run.
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: "5"
    locations: classpath:db/migration
  test:
    context:
      failure:
        threshold: 10000000
  main:
    # Allows overriding of bean definitions
    allow-bean-definition-overriding: true
  profiles:
    active: ${SPRING_BOOT_PROFILE_ACTIVE}
  application:
    # The name of the Spring Boot application, taken from the app.name property
    name: ${app.name}
  security:
    # Disables the security for the Spring Boot application
    oauth2:
#      clientRegistrationId: directory-backend-client
      client:
        registration:
          external:
            provider: external
            client-id: ${AUTH_CLIENT_ID}
            client-secret: ${AUTH_CLIENT_SECRET}
            scope: profile directory-backend-app-scope openid
            authorization-grant-type: password
        provider:
          external:
            issuer-uri: ${AUTH_SERVER_URI}
            jwk-set-uri: ${spring.security.oauth2.client.provider.external.issuer-uri}/protocol/openid-connect/certs
  cloud:
    # The Spring Cloud Config specific configurations
    #<><><><><><><><><><><><><><><> VAULT <><><><><><><><><><><><><><>
    vault:
      enabled: ${VAULT_ENABLED}
      token: ${VAULT_TOKEN}
      uri: ${VAULT_SERVER_URI}
      # Resolved before the TLS bundle exists, so it names the truststore directly. It holds the PRX internal CA that signs every *.tst
      # certificate (the JVM image also gets it in its cacerts from the Dockerfile).
      ssl:
        trust-store: ${SSL_TRUSTSTORE_URL:classpath:${SSL_TRUSTSTORE_LOCATION}}
        trust-store-password: ${SSL_TRUSTSTORE_PASSWORD}
        trust-store-type: ${SSL_TRUSTSTORE_TYPE}
      kv:
        backend: PRX
        default-context: ${umdc.app.name}
      application-name: ${umdc.app.name}
    bootstrap:
      # Enables the Spring Cloud Bootstrap application context
      enabled: ${SPRING_BOOT_CLOUD_BOOTSTRAP_ENABLED}
    # The active profile for the Spring Cloud Config
    profile: ${SPRING_BOOT_PROFILE_ACTIVE}
    config:
      # The active profile for the Spring Cloud Config
      profile: ${SPRING_BOOT_PROFILE_ACTIVE}
      # The label for the Spring Cloud Config
      label: ${SPRING_CLOUD_CONFIG_LABEL}
      # The URI for the Spring Cloud Config server
      uri: ${CNFS_URI}
      port: ${CNFS_PORT}
      # Enables sending of state for the Spring Cloud Config
      send-state: true
      # TLS configuration for the Config client — trusts the private CA on prx-qa.config-server.tst
      tls:
        enabled: true
        trust-store: ${SSL_TRUSTSTORE_URL:classpath:${SSL_TRUSTSTORE_LOCATION}}
        trust-store-password: ${SSL_TRUSTSTORE_PASSWORD}
        trust-store-type: ${SSL_TRUSTSTORE_TYPE}
    openfeign:
      client:
        config:
          default:
            ssl-bundle: directory-security
#  data:
#    redis:
#      port: ${REDIS_PORT:6379}
#      password: ${REDIS_PASSWORD:}
#      timeout: ${REDIS_TIMEOUT:5000ms}
#      ssl:
#        enabled: ${REDIS_SSL_ENABLED:true}
#      url: ${REDIS_URL}

  jpa:
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: true
        jdbc:
          lob:
            non_contextual_creation: true
    # Defers the initialization of the datasource
    defer-datasource-initialization: true

swagger:
  base-package: 'com.umdc.directory.api.v1.controller'
  api-info:
    title: ${umdc.app.name}
    version: ${umdc.app.version}
    description: ${umdc.app.description}
    contact:
      name: 'Luis Antonio Mata'
      url: 'www.prx.test'
      email: 'luis.antonio.mata@gmail.com'
    cache:
      disabled: true
# Eureka client TLS — trusts the private CA on prx-qa.services-monitor.tst
eureka:
  client:
    tls:
      enabled: true
      trust-store: ${SSL_TRUSTSTORE_URL:classpath:${SSL_TRUSTSTORE_LOCATION}}
      trust-store-password: ${SSL_TRUSTSTORE_PASSWORD}
      trust-store-type: ${SSL_TRUSTSTORE_TYPE}

# springdoc follows umdc.docs.enabled: with the documentation closed the endpoints are not even registered
springdoc:
  api-docs:
    enabled: ${umdc.docs.enabled}
  swagger-ui:
    enabled: ${umdc.docs.enabled}
---
# dev profile: documentation open by default
spring:
  config:
    activate:
      on-profile: dev
umdc:
  docs:
    enabled: ${UMDC_DOCS_ENABLED:true}
