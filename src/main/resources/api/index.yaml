        required: true
      description: Changes `active` (soft delete) of the favorite. The target in the body `id` is resolved with the repository of the favorite
        type (store, campaign or product). Reactivating when the user already has another active favorite for the same target is 409.
    delete:
      summary: Delete Favorite
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Favorite deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the owner
        '404':
          description: Favorite not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - favorites
      description: Soft-deletes a favorite of the token user.
  /api/v1/businesses/images:
    post:
      summary: Upload a business image
      description: 'Stores the image in object storage. The `objectKey` of the client is ignored: the server always generates the key under the
        `businesses/` prefix.'
      tags:
      - v1
      - businesses
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: Required. Without a valid token the answer is 401.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageUploadForm'
      responses:
        '201':
          description: Image stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Invalid image (type or size)
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/businesses/images/{businessId}:
    parameters:
    - name: businessId
      in: path
      required: true
      schema: *id001
    post:
      summary: Upload the profile image of a business (owner only)
      description: Stores the image and saves its public URL in the business profile image reference. Any client-supplied `objectKey` is ignored.
      tags:
      - v1
      - businesses
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: Required. Without a valid token the answer is 401.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageUploadForm'
      responses:
        '201':
          description: Image stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
        '400':
          description: Invalid image (type or size)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller does not own the business
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/products/business/{businessId}:
    parameters:
    - name: businessId
      in: path
      required: true
      schema: *id001
    get:
      summary: List products for a business
      description: Paginated (page is 1-based, per_page default 10, max 100). The public list only returns active products linked and active.
        With `include_inactive=true` the owner sees all of them.
      tags:
      - v1
      - products
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: active
        in: query
        schema:
          type: boolean
        description: Filter by product status. Only honoured with `include_inactive=true` by the owner; the public list ignores it.
      - name: include_inactive
        in: query
        schema:
          type: boolean
          default: false
        description: Owner only. Includes deactivated products. Requires `session-token`; without it the answer is 401, for a non-owner 403.
      - name: session-token
        in: header
        required: false
        schema:
          type: string
        description: Optional for the public list (active products only). Required with `include_inactive=true`.
      responses:
        '200':
          description: Products found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          description: Invalid request parameters
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/businesses/nearby:
    get:
      summary: Locations near a point
      description: Public. Locations within `radius_m` metres of (lat, lng), one row per location with `distance_m`. Sorted by distance (ties
        by id) or by name. An invalid parameter is 400 with the reason in the `message-error` header. Dedicated quota, 60 requests per minute per user
        (or per IP when there is no session-token), configurable with `umdc.ratelimit.nearby-per-minute`; over it the answer is 429 with `Retry-After`,
        `X-RateLimit-Limit` and `message`.
      tags:
      - v1
      - businesses
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: lng
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: radius_m
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50000
          default: 5000
      - name: category_id
        in: query
        schema: &id002
          type: string
          format: uuid
        description: Category id; its sub-categories are included
      - name: city_id
        in: query
        schema: *id002
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
        description: Text found in the name or the description
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - distance
          - name
          default: distance
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      security: []
      responses:
        '200':
          description: A page of locations with their distance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessNearbyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/businesses/map:
    get:
      summary: Businesses of a map area
      description: 'Public. GeoJSON FeatureCollection. At zoom 14 and above: one Point per location. Below 14: grid clusters (Point features with
        properties `cluster=true` and `count`). `truncated` is true when more results than `limit` exist. An invalid, inverted or too large bbox
        (more than 90 degrees per axis) or any other invalid parameter is 400 with the reason in `message-error`. Dedicated quota: 60 requests per minute
        per user (or per IP when there is no session-token), configurable with `umdc.ratelimit.map-per-minute`; over it the answer is 429 with `Retry-After`,
        `X-RateLimit-Limit` and `message`.'
      tags:
      - v1
      - businesses
      parameters:
      - name: bbox
        in: query
        required: true
        schema:
          type: string
        description: minLng,minLat,maxLng,maxLat
        example: -79.6,43.5,-79.1,43.9
      - name: zoom
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 22
          default: 14
      - name: category_id
        in: query
        schema: &id003
          type: string
          format: uuid
        description: Category id; its sub-categories are included
      - name: city_id
        in: query
        schema: *id003
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
        description: Text found in the name or the description
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
      security: []
      responses:
        '200':
          description: GeoJSON FeatureCollection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessMapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/businesses/{businessId}/locations/{locationId}/hours:
    parameters: &id004
    - name: businessId
      in: path
      required: true
      schema: *id001
    - name: locationId
      in: path
      required: true
      schema: *id001
    get:
      summary: Opening hours of a location
      description: Public. Slots in week order, in local time of the business zone. `slots` is empty when none were set.
      tags:
      - v1
      - opening-hours
      security: []
      responses:
        '200':
          description: The hours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningHours'
        '404':
          description: Business or location not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      summary: Replace the opening hours of a location (owner only)
      description: 'Replaces the whole schedule: up to 4 non-overlapping slots per day, `HH:mm`, a closed day is one slot with `closed=true`.
        Checks, in order: token (401), business (404), owner (403), location (404), body (400, reason in `message-error`).'
      tags:
      - v1
      - opening-hours
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: Required. Without a valid token the answer is 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningHours'
      responses:
        '200':
          description: The stored hours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningHours'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not the owner of the business
        '404':
          description: Business or location not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/businesses/{businessId}/locations/{locationId}/hours/status:
    parameters: *id004
    get:
      summary: Open-now status of a location
      description: Public. `open_now` plus the next closing (when open) or next opening (when closed), in the business zone.
      tags:
      - v1
      - opening-hours
      security: []
      parameters:
      - name: at
        in: query
        schema:
          type: string
          format: date-time
        description: ISO-8601 instant to evaluate; now when omitted
      responses:
        '200':
          description: The status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningStatus'
        '400':
          description: '`at` is not an ISO-8601 instant'
        '404':
          description: Business or location not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/geocode:
    post:
      summary: Geocode an address
      description: Authenticated. Returns up to 5 coordinate candidates; nothing is stored. The reason of a failure is in the `message-error`
        header. Dedicated quota, 10 requests per minute per user (or per IP), configurable with `umdc.ratelimit.geocode-per-minute`; over it the
        answer is 429 with `Retry-After`, `X-RateLimit-Limit` and `message`, and the geocoding provider is not called.
      tags:
      - v1
      - geocoding
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: Required; must carry a user id. Without it the answer is 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeocodeRequest'
      responses:
        '200':
          description: The candidates (possibly empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodeResponse'
        '400':
          description: Invalid body (address missing or fields too long, country not ISO alpha-2)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: The geocoding provider failed
        '503':
          description: Geocoding is not enabled
        '504':
          description: The geocoding provider timed out
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/campaigns/{campaignId}/deactivate:
    post:
      summary: Deactivate a campaign
      description: Owner only. Sets the campaign to `PAUSED` (`active=false`). Allowed from `SCHEDULED` or `ACTIVE`. No request body.
      tags:
      - v1
      - campaings
      parameters:
      - name: campaignId
        in: path
        required: true
        schema: *id001
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401."
      responses:
        '200':
          description: Campaign with `status` PAUSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "The caller does not own the business of the campaign"
        '404':
          description: "Campaign not found"
        '409':
          description: "Illegal status transition (`Campaign status transition not allowed: A -> B`); nothing is changed"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/campaigns/{campaignId}/reactivate:
    post:
      summary: Reactivate a campaign
      description: Owner only. Only a `PAUSED` campaign can be reactivated; it becomes `ACTIVE`, or `SCHEDULED` when its start date has not been reached. An `EXPIRED` campaign cannot be reactivated. No request body.
      tags:
      - v1
      - campaings
      parameters:
      - name: campaignId
        in: path
        required: true
        schema: *id001
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401."
      responses:
        '200':
          description: Campaign with `status` ACTIVE or SCHEDULED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "The caller does not own the business of the campaign"
        '404':
          description: "Campaign not found"
        '409':
          description: "Illegal status transition (`Campaign status transition not allowed: A -> B`); nothing is changed"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/campaigns/{campaignId}/publish:
    post:
      summary: Publish a draft campaign
      description: Owner only. Only a `DRAFT` campaign whose end date has not passed can be published; it becomes `SCHEDULED` or `ACTIVE`. No request body.
      tags:
      - v1
      - campaings
      parameters:
      - name: campaignId
        in: path
        required: true
        schema: *id001
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401."
      responses:
        '200':
          description: Campaign published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "The caller does not own the business of the campaign"
        '404':
          description: "Campaign not found"
        '409':
          description: "Illegal status transition (`Campaign status transition not allowed: A -> B`); nothing is changed"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/products/{productId}:
    parameters:
    - name: productId
      in: path
      required: true
      schema: *id001
    patch:
      summary: Update a product (partial)
      description: Owner only (the creator, or an owner of a business that carries the product). Only the fields sent change; the merged result is
        validated. `price` and `currency` go together. `active=true` reactivates a product.
      tags:
      - v1
      - products
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
            example:
              price: 9.9
              currency: USD
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCreateResponse'
        '400':
          description: "Invalid field (blank or too long name/description, bad price or currency, unknown category, imageRef over 512 characters)"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "The caller is not the owner of the product"
        '404':
          description: "Product not found"
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      summary: Replace a product
      description: Owner only. `name`, `description` and `categoryId` are required; `price`, `currency` and `imageRef` are replaced (absent means cleared).
      tags:
      - v1
      - products
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Product replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCreateResponse'
        '400':
          description: "Missing or invalid field"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "The caller is not the owner of the product"
        '404':
          description: "Product not found"
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      summary: Deactivate a product (soft delete)
      description: Owner only. Sets `active=false`; the row and its business links are kept. Idempotent. Reactivate with `PATCH` with `active=true`.
      tags:
      - v1
      - products
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401."
      responses:
        '204':
          description: Product deactivated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "The caller is not the owner of the product"
        '404':
          description: "Product not found"
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/users/me/saved-searches:
    post:
      summary: Save a search
      description: 'Stores the search parameters of the caller. At most 20 per user; the name is unique per user ignoring case. Validation order: 401,
        400 body, 400 name, 400 params, 409.'
      tags:
      - v1
      - saved-searches
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401 (`message-error: Unauthorized`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedSearchCreateRequest'
            example:
              name: Cafes near home
              params:
                lat: 19.43
                lng: -99.13
                radius_m: 1500
                sort: distance
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSearch'
        '400':
          description: "Missing body, invalid name (blank or over 80 characters) or invalid parameters"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: "Duplicate name or the limit of 20 saved searches was reached"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      summary: List saved searches
      description: The saved searches of the caller, newest first.
      tags:
      - v1
      - saved-searches
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401 (`message-error: Unauthorized`)."
      responses:
        '200':
          description: Saved searches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSearchList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/users/me/saved-searches/{id}:
    patch:
      summary: Rename a saved search
      description: A saved search of another user answers 404, never 403.
      tags:
      - v1
      - saved-searches
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401 (`message-error: Unauthorized`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 80
              required:
              - name
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSearch'
        '400':
          description: "Invalid name"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "Not found (or not the caller's)"
        '409':
          description: "Another saved search of the caller has that name"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      summary: Delete a saved search
      description: Physical delete.
      tags:
      - v1
      - saved-searches
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401 (`message-error: Unauthorized`)."
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "Not found (or not the caller's)"
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/users/me/saved-searches/{id}/replay:
    get:
      summary: Replay a saved search
      description: Returns the endpoint and the query parameters to call to repeat the search, and stamps `last_used_at`.
      tags:
      - v1
      - saved-searches
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401 (`message-error: Unauthorized`)."
      responses:
        '200':
          description: Endpoint and parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchReplay'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "Not found (or not the caller's)"
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/users/me/last-search:
    get:
      summary: Get the last search
      tags:
      - v1
      - saved-searches
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401 (`message-error: Unauthorized`)."
      responses:
        '200':
          description: Last search of the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LastSearch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No last search (`message-error: No last search`)"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      summary: Store the last search
      description: Upsert; one last search per user. The client sends it after running a search.
      tags:
      - v1
      - saved-searches
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401 (`message-error: Unauthorized`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchParams'
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LastSearch'
        '400':
          description: "Invalid or empty parameters"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/businesses/{businessId}/events:
    post:
      summary: Count a click event of a business
      description: 'Adds one to the aggregated daily counter (UTC) of the business, campaign and type. Nothing about the user is stored. An event by
        the owner is not counted. Extra rate limit: 20 per minute per client and business (`umdc.ratelimit.events-per-minute`).'
      tags:
      - v1
      - business-events
      parameters:
      - name: businessId
        in: path
        required: true
        schema: *id001
      - name: session-token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessEventRequest'
            example:
              type: CALL
      responses:
        '204':
          description: Counted (or ignored because the caller is the owner)
        '400':
          description: "Missing body or invalid type"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "Business not found, or the campaign does not belong to the business"
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/businesses/{businessId}/events/summary:
    get:
      summary: Click events summary (owner only)
      description: Totals by type, by campaign and by day (zeros included) for a window of at most 365 days. `to` defaults to today (UTC) and `from`
        to `to` minus 29 days.
      tags:
      - v1
      - business-events
      parameters:
      - name: businessId
        in: path
        required: true
        schema: *id001
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: session-token
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessEventSummary'
        '400':
          description: "`from` after `to` or a window over 365 days"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "The caller is not the owner of the business"
        '404':
          description: "Business not found"
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/users/me/favorite-lists:
    post:
      summary: Create a favorite list
      description: 'At most 20 per user; the name is unique per user ignoring case, 1..80 characters.'
      tags:
      - v1
      - favorite-lists
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401 (`message-error: Unauthorized`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteListNameRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteList'
        '400':
          description: "Missing body or invalid name"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: "Duplicate name or the limit of 20 lists was reached"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      summary: List my favorite lists
      description: Newest first, with the number of active favorites of each.
      tags:
      - v1
      - favorite-lists
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401 (`message-error: Unauthorized`)."
      responses:
        '200':
          description: The lists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteListsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/users/me/favorite-lists/{id}:
    get:
      summary: Get a favorite list
      description: The list with one page (0-based) of its active favorites, newest first. A list of another user answers 404, never 403.
      tags:
      - v1
      - favorite-lists
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401 (`message-error: Unauthorized`)."
      responses:
        '200':
          description: The list and its page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteListDetail'
        '400':
          description: "page below 0 or size below 1"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "Not found (or not the caller's)"
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      summary: Rename a favorite list
      description: Same rules as the creation.
      tags:
      - v1
      - favorite-lists
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401 (`message-error: Unauthorized`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteListNameRequest'
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteList'
        '400':
          description: "Invalid name"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "Not found (or not the caller's)"
        '409':
          description: "Another list of the caller has that name"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      summary: Delete a favorite list
      description: Deletes the list and its items; the favorites themselves are kept.
      tags:
      - v1
      - favorite-lists
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401 (`message-error: Unauthorized`)."
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "Not found (or not the caller's)"
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/users/me/favorite-lists/{id}/items:
    post:
      summary: Add a favorite to a list
      description: Only an active store or product favorite of the caller; a favorite may be in several lists. Validation order is 401, 404 list, 400 body, 404 favorite, 409 inactive, 400 offer, 409 already in the list.
      tags:
      - v1
      - favorite-lists
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401 (`message-error: Unauthorized`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteListItemRequest'
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteListItem'
        '400':
          description: "Missing favorite_id or the favorite is an offer"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "List or favorite not found (or not the caller's)"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '409':
          description: "Favorite inactive or already in the list"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/users/me/favorite-lists/{id}/items/{favoriteId}:
    delete:
      summary: Remove a favorite from a list
      description: The favorite itself is kept.
      tags:
      - v1
      - favorite-lists
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: favoriteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: "Required. Without a valid token the answer is 401 (`message-error: Unauthorized`)."
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "List not found or the favorite is not in it"
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  headers:
    MessageError:
      description: Reason of the failure when the endpoint explains it
      schema: &id005
        type: string
  responses:
    BadRequest:
      description: Invalid request. When the endpoint explains it, the reason is in the `message-error` header.
      headers:
        message-error:
          $ref: '#/components/headers/MessageError'
    Unauthorized:
      description: Missing or invalid `session-token`
    Forbidden:
      description: The caller is not allowed (for example not the owner)
    NotFound:
      description: Resource not found
    InternalError:
      description: Internal server error
    TooManyRequests:
      description: 'Rate limit exceeded (global rate limiting on /api/v1/**: one bucket per client IP and one per user). Wait `Retry-After` seconds.'
      headers:
        Retry-After:
          description: Seconds until one request is allowed again (at least 1)
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Limit:
          description: Requests per minute allowed for the bucket that rejected the request
          schema:
            type: integer
        message:
          description: 'Reason, e.g. `Too many requests, retry in N seconds`'
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: too_many_requests
              retryAfterSeconds:
                type: integer
  schemas:
    BusinessCreateRequest:
      type: object
      properties:
        name: *id005
        description: *id005
        categoryId: *id001
        userId:
          type: string
          format: uuid
          description: 'Ignored as owner: the owner is the token user; a different value is 403'
        email:
          type: string
          format: email
        customerServiceEmail:
          type: string
          format: email
        orderManagementEmail:
          type: string
          format: email
        website: *id005
      required:
      - name
      - description
      - categoryId
      - userId
      - email
    BusinessCreateResponse:
      type: object
      properties:
        id: *id001
        businessName: *id005
        createdDate: &id006
          type: string
          format: date-time
        updatedDate: *id006
    BusinessUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1500
        categoryId: *id001
        email:
          type: string
          format: email
        customerServiceEmail:
          type: string
          format: email
        orderManagementEmail:
          type: string
          format: email
        website: *id005
    BusinessUpdateResponse:
      type: object
      properties:
        updatedDate: *id006
    Business:
      type: object
      description: Business as returned by the read endpoints (BusinessTO)
      additionalProperties: true
    Campaign:
      type: object
      description: Campaign (CampaignTO)
      additionalProperties: true
    CampaignUpdateResponse:
      type: object
      properties:
        id: *id001
        lastUpdate: *id006
    CampaignListResponse:
      type: object
      properties:
        total_count:
          type: integer
          format: int64
        page:
          type: integer
        per_page:
          type: integer
        total_pages:
          type: integer
        actives:
          type: integer
          format: int64
        inactives:
          type: integer
          format: int64
        expired:
          type: integer
          format: int64
        items:
          type: array
          items:
            type: object
            additionalProperties: true
    ProductCreateRequest:
      type: object
      properties:
        name: *id005
        description: *id005
        categoryId: *id001
        price:
          type: number
          description: '>= 0, at most 2 decimals. Goes with `currency`.'
        currency:
          type: string
          description: ISO 4217 code, 3 letters (stored upper case). Goes with `price`.
        imageRef:
          type: string
          maxLength: 512
        businessId:
          type: string
          format: uuid
          description: Optional. When present the caller must own it and the product is linked to it in the same request.
      required:
      - name
      - description
      - categoryId
    ProductCreateResponse:
      type: object
      properties:
        id: *id001
        name: *id005
        description: *id005
        createdDate: *id006
        lastUpdate: *id006
        categoryId: *id001
        price:
          type: number
          nullable: true
        currency:
          type: string
          nullable: true
        imageRef:
          type: string
          nullable: true
        active:
          type: boolean
    ProductUpdateRequest:
      type: object
      description: All fields optional on PATCH; on PUT `name`, `description` and `categoryId` are required.
      properties:
        name: *id005
        description: *id005
        categoryId: *id001
        price:
          type: number
        currency:
          type: string
        imageRef:
          type: string
          maxLength: 512
        active:
          type: boolean
    LinkBusinessProductRequest:
      type: object
      properties:
        businessId: *id001
        productId: *id001
      required:
      - businessId
    LinkBusinessProductResponse:
      type: object
      properties:
        businessId: *id001
        productId: *id001
        createdAt: *id006
        lastUpdate: *id006
        active: &id007
          type: boolean
    ProductListResponse:
      type: object
      properties:
        total_count:
          type: integer
          format: int64
        page:
          type: integer
        per_page:
          type: integer
        total_pages:
          type: integer
        data:
          type: array
          items:
            type: object
            additionalProperties: true
    ImageUploadForm:
      type: object
      properties:
        image:
          type: string
          format: binary
        contentType:
          type: string
          default: image/jpeg
          description: MIME type of the image
        objectKey:
          type: string
          description: Ignored by the server (deprecated)
          deprecated: true
      required:
      - image
    ImageUploadResponse:
      type: object
      description: Stored image reference (key and public URL)
      additionalProperties: true
    FavoriteCreateRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - STORE
          - PRODUCT
          - OFFER
        itemId: *id001
      required:
      - type
      - itemId
    FavoriteUpdateRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Target item id
        active: *id007
      required:
      - id
    FavoriteResponse:
      type: object
      properties:
        id: *id001
        type: *id005
        itemId: *id001
        userId: *id001
        createdDate: *id006
        updatedDate: *id006
        active: *id007
    FavoritesResponse:
      type: object
      properties:
        stores:
          type: array
          items:
            $ref: '#/components/schemas/Business'
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductCreateResponse'
        offers:
          type: array
          items:
            type: object
            additionalProperties: true
    BusinessNearbyItem:
      type: object
      properties:
        location_id: *id001
        business_id: *id001
        name: *id005
        description: *id005
        category_id: *id001
        category_name: *id005
        verified: *id007
        profile_image_ref: *id005
        city_id: *id001
        city_name: *id005
        location_name: *id005
        address_line: *id005
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        main: *id007
        distance_m:
          type: integer
          format: int64
          description: Distance in metres from the searched point
    BusinessNearbyResponse:
      type: object
      properties:
        total_count:
          type: integer
          format: int64
        page:
          type: integer
        per_page:
          type: integer
        total_pages:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/BusinessNearbyItem'
    GeoPoint:
      type: object
      properties:
        type:
          type: string
          enum:
          - Point
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          description: '[longitude, latitude], 5 decimals'
    MapFeature:
      type: object
      properties:
        type:
          type: string
          enum:
          - Feature
        geometry:
          $ref: '#/components/schemas/GeoPoint'
        properties:
          type: object
          additionalProperties: true
          description: 'Location: business_id, location_id, name, category_id, verified, main. Cluster (zoom below 14): cluster=true, count.'
    BusinessMapResponse:
      type: object
      properties:
        type:
          type: string
          enum:
          - FeatureCollection
        features:
          type: array
          items:
            $ref: '#/components/schemas/MapFeature'
        truncated:
          type: boolean
          description: true when the limit was reached and more results exist
        clustered:
          type: boolean
          description: true when the features are clusters
        zoom:
          type: integer
    OpeningSlot:
      type: object
      properties:
        day_of_week:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO day, 1 = Monday ... 7 = Sunday
        opens_at:
          type: string
          nullable: true
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 09:00
        closes_at:
          type: string
          nullable: true
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '17:30'
          description: '`23:59` means until the end of the day'
        closed:
          type: boolean
          description: true for a closed day; then opens_at and closes_at must be null
      required:
      - day_of_week
    OpeningHours:
      type: object
      properties:
        slots:
          type: array
          items:
            $ref: '#/components/schemas/OpeningSlot'
        timezone:
          type: string
          readOnly: true
          description: IANA zone of the hours (response only)
          example: America/Toronto
    OpeningStatus:
      type: object
      properties:
        open_now: *id007
        closes_at:
          type: string
          format: date-time
          description: Next closing, only when open
        opens_at:
          type: string
          format: date-time
          description: Next opening, only when closed and one is foreseeable
        timezone: *id005
      required:
      - open_now
    GeocodeRequest:
      type: object
      properties:
        address:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 200
        country:
          type: string
          maxLength: 200
          pattern: ^[A-Za-z]{2}$
          default: ca
          description: ISO 3166-1 alpha-2
      required:
      - address
    GeocodeResponse:
      type: object
      properties:
        candidates:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              label: *id005
              latitude:
                type: number
                format: double
              longitude:
                type: number
                format: double
              confidence:
                type: number
                format: double
                description: Optional
    SearchParams:
      type: object
      description: At least one filter is required. `lat` and `lng` go together and exclude `bbox`; `radius_m` and `sort` need a point.
      properties:
        q: *id005
        category_id: *id001
        city_id: *id001
        city: *id005
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        radius_m:
          type: integer
        bbox:
          type: string
          description: minLng,minLat,maxLng,maxLat
        sort:
          type: string
          enum: [distance, name]
    SavedSearchCreateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        params:
          $ref: '#/components/schemas/SearchParams'
      required:
      - name
      - params
    SavedSearch:
      type: object
      properties:
        id: *id001
        name: *id005
        params:
          $ref: '#/components/schemas/SearchParams'
        created_at: *id006
        updated_at: *id006
        last_used_at:
          type: string
          format: date-time
          nullable: true
    SavedSearchList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SavedSearch'
        max:
          type: integer
          example: 20
    SearchReplay:
      type: object
      properties:
        endpoint:
          type: string
          enum: [/api/v1/businesses/search, /api/v1/businesses/nearby, /api/v1/businesses/map]
        params:
          type: object
          additionalProperties:
            type: string
    LastSearch:
      type: object
      properties:
        params:
          $ref: '#/components/schemas/SearchParams'
        updated_at: *id006
    BusinessEventRequest:
      type: object
      properties:
        type:
          type: string
          enum: [ROUTE, CALL, WEB, SAVE]
          description: Case-insensitive.
        campaign_id:
          type: string
          format: uuid
          description: Optional; must belong to the business.
      required:
      - type
    EventCounts:
      type: object
      description: Counts by type
      properties:
        CALL:
          type: integer
          format: int64
        ROUTE:
          type: integer
          format: int64
        SAVE:
          type: integer
          format: int64
        WEB:
          type: integer
          format: int64
    BusinessEventSummary:
      type: object
      properties:
        businessId: *id001
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        total:
          type: integer
          format: int64
        totalsByType:
          $ref: '#/components/schemas/EventCounts'
        campaigns:
          type: array
          description: Only campaigns with events; `campaign_id` is null for events without campaign
          items:
            type: object
            properties:
              campaign_id:
                type: string
                format: uuid
                nullable: true
              total:
                type: integer
                format: int64
              byType:
                $ref: '#/components/schemas/EventCounts'
        daily:
          type: array
          description: One entry per day, zeros included, oldest first
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              total:
                type: integer
                format: int64
              byType:
                $ref: '#/components/schemas/EventCounts'
