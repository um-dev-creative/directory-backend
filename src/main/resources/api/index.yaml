      responses:
        '200':
          description: Find User by ID
          headers:
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
            X-XSS-Protection:
              schema:
                type: integer
              example: '0'
            Cache-Control:
              schema:
                type: string
              example: no-cache, no-store, max-age=0, must-revalidate
            Pragma:
              schema:
                type: string
              example: no-cache
            Expires:
              schema:
                type: integer
              example: '0'
            Strict-Transport-Security:
              schema:
                type: string
              example: max-age=31536000 ; includeSubDomains
            X-Frame-Options:
              schema:
                type: string
              example: DENY
            Transfer-Encoding:
              schema:
                type: string
              example: chunked
            Date:
              schema:
                type: string
              example: Fri, 25 Jul 2025 01:30:17 GMT
            Keep-Alive:
              schema:
                type: string
              example: timeout=60
            Connection:
              schema:
                type: string
              example: keep-alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  alias:
                    type: string
                  email:
                    type: string
                    format: email
                  firstName:
                    type: string
                  middleName:
                    type: string
                  lastName:
                    type: string
                  displayName:
                    type: string
                  profileImageRef:
                    type: string
                  phoneId:
                    type: string
                  phoneNumber:
                    type: string
                    format: phone
                  dateOfBirth:
                    type: string
                    format: date
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                  notificationEmail:
                    type: boolean
                  notificationSms:
                    type: boolean
                  privacyDataOutActive:
                    type: boolean
                  status:
                    type: boolean
                  roleId:
                    type: string
                  applicationId:
                    type: string
              example:
                id: 3171803c-bb08-4eb0-8821-b6ebe5948f48
                alias: fbaggins-20
                email: lantmata@gmail.com
                firstName: Frodo
                middleName: ''
                lastName: Baggins
                displayName: Frodo Baggins
                profileImageRef: LTHB/3171803c-bb08-4eb0-8821-b6ebe5948f48-250723104035.jpg
                phoneId: e24cb175-e595-4eeb-b7b0-95c94c40a195
                phoneNumber: +1 416 858 0487
                dateOfBirth: '1999-02-12'
                createdAt: '2025-07-17 00:59:33'
                updatedAt: '2025-07-23 06:20:14'
                notificationEmail: true
                notificationSms: true
                privacyDataOutActive: true
                status: true
                roleId: 9a232260-a2e3-4990-b062-b6966efb25f8
                applicationId: c9291036-fd71-4f2b-9986-2c5d4e5a0f8b
        '400':
          description: Invalid request
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - users
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
      example: 50a856bd-8706-4de2-b4bb-e44b932191d7
    put:
