  /api/v1/businesses/{businessId}/views:
    post:
      summary: Count a view of a business
      description: Adds one view to today's (UTC) counter. Nothing about the viewer is stored (no user, IP or user agent); a view by the owner
        of the business is not counted.
      parameters:
      - name: businessId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: session-token
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Counted (or ignored because the viewer is the owner)
        '404':
          description: Business not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/businesses/{businessId}/stats:
    get:
      summary: Views summary of a business (owner only)
      description: Window of 1 to 365 days ending today (UTC), default 30.
      parameters:
      - name: businessId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: days
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
      - name: session-token
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{ businessId, from, to, totalViews, viewsToday, viewsLast7Days, daily: [ { date: yyyy-MM-dd, views } ] } - one entry per
            day, zeros included, oldest first'
        '400':
          description: days out of range
        '401':
          description: Unauthorized
        '403':
          description: The caller is not the owner of the business
        '404':
          description: Business not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/businesses/search:
    get:
      summary: Search businesses by city, category and text
      description: Public (no session-token needed). Paginated (page is 1-based, per_page 1..100, default 10). Filters are combined with AND;
        results are ordered by name, or by distance with `sort=distance` (needs `lat` and `lng`). category_id includes its sub-categories; city
        is ignored when city_id is sent. `open_now=true` and `sort=distance` are resolved over the first 1000 matches (by name) and `total_count`
        is the number kept. Phase 3 is additive; old clients ignore the new item fields.
      parameters:
      - name: city_id
        in: query
        schema:
          type: string
          format: uuid
      - name: city
        in: query
        schema:
          type: string
      - name: category_id
        in: query
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: open_now
        in: query
        description: true keeps only the businesses open right now (any location, using its opening hours in the business time zone); false or absent
          does not filter
        schema:
          type: boolean
      - name: lat
        in: query
        description: Latitude of the caller, -90..90. Send it together with lng; fills distance_m
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: lng
        in: query
        description: Longitude of the caller, -180..180. Send it together with lat
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: sort
        in: query
        description: name (default) or distance (nearest first, businesses without distance last; needs lat and lng)
        schema:
          type: string
          enum:
          - name
          - distance
          default: name
      - name: session-token
        in: header
        required: false
        description: Optional; this endpoint is public
        schema:
          type: string
      responses:
        '200':
          description: 'Page of businesses with their locations: { total_count, page, per_page, total_pages, data: [ { id, name, description,
            categoryId, categoryName, verified, profileImageRef, locations: [Location], open_now, distance_m } ] }. `open_now` (boolean) is null
            when no location has opening hours. `distance_m` (integer, metres to the nearest location with coordinates) is null when no point
            was sent or no location has coordinates.'
        '400':
          description: Invalid page, per_page, lat, lng or sort (reason in the message-error header)
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/cities:
    get:
      summary: List the cities of the catalogue
      parameters:
      - name: country
        in: query
        description: ISO 3166-1 alpha-2, e.g. CA
        schema:
          type: string
      - name: q
        in: query
        description: Text found in the city name
        schema:
          type: string
      - name: session-token
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '[ { id, name, province, country } ] ordered by name'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/businesses/{businessId}/locations:
    parameters:
    - name: businessId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: session-token
      in: header
      required: true
      schema:
        type: string
    get:
      summary: List the locations of a business (main first)
      responses:
        '200':
          description: '[Location]'
        '404':
          description: Business not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      summary: Create a location (owner only)
      description: The first location is always the main one; main=true on a later one replaces the previous main.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - cityId
              - addressLine
              properties:
                cityId:
                  type: string
                  format: uuid
                name:
                  type: string
                  maxLength: 120
                addressLine:
                  type: string
                  maxLength: 200
                postalCode:
                  type: string
                  maxLength: 10
                phone:
                  type: string
                  maxLength: 30
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                  description: Sent together with longitude
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                  description: Sent together with latitude
                main:
                  type: boolean
      responses:
        '201':
          description: 'Location: { id, businessId, city: { id, name, province, country }, name, addressLine, postalCode, phone, latitude, longitude,
            main, createdAt, lastUpdate }'
        '400':
          description: Invalid body or unknown city (reason in the message-error header)
        '401':
          description: Unauthorized
        '403':
          description: The caller is not the owner of the business
        '404':
          description: Business not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/businesses/{businessId}/locations/{locationId}:
    parameters:
    - name: businessId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: session-token
      in: header
      required: true
      schema:
        type: string
    patch:
      summary: Update a location (owner only)
      description: Only the fields that are sent change. main=true makes it the main location; main=false on the main one is rejected (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cityId:
                  type: string
                  format: uuid
                name:
                  type: string
                  maxLength: 120
                addressLine:
                  type: string
                  maxLength: 200
                postalCode:
                  type: string
                  maxLength: 10
                phone:
                  type: string
                  maxLength: 30
                latitude:
                  type: number
                longitude:
                  type: number
                main:
                  type: boolean
      responses:
        '200':
          description: The updated Location
        '400':
          description: Invalid body, unknown city or main=false on the main location
        '401':
          description: Unauthorized
        '403':
          description: The caller is not the owner of the business
        '404':
          description: Business or location not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      summary: Delete a location (owner only)
      description: If it was the main one, the oldest remaining location becomes the main one.
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
        '403':
          description: The caller is not the owner of the business
        '404':
          description: Business or location not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/campaigns/{campaignId}:
    parameters:
    - name: campaignId
      in: path
      required: true
      schema: *id001
      example: 64d0648d-a3ff-4fa6-83e1-649cea48bc09
    get:
      summary: Find Campaign
      parameters:
      - name: session-token
        in: header
        schema:
          type: string
        example: '{{directorySessionTokenName}}'
        required: false
        description: Optional. A draft or hidden campaign is only visible to the owner of its business.
      responses:
        '200':
          description: Campaign found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          description: Invalid UUID
        '404':
          description: Campaign not found, or hidden from the caller
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - campaings
    patch:
      summary: Update Campaign
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: Required. Without a valid token the answer is 401.
      - name: session-token-bkd
        in: header
        required: false
        deprecated: false
        schema: {}
        example: '{{backboneSessionToken}}'
      responses:
        '202':
          description: Update accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller does not own the business (or one of the two businesses when moving it)
        '404':
          description: Campaign, category or business not found
        '409':
          description: The campaign was modified by another request (stale `lastUpdate`) or the change is an illegal status transition
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - campaings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                businessId:
                  type: string
                categoryId:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                discount:
                  type: integer
                active:
                  type: boolean
                terms:
                  type: string
                type:
                  type: string
                  enum: [PROMOTION, EVENT, ANNOUNCEMENT]
            example:
              title: Octava oferta
              description: Descripcion
              businessId: 1a24da99-78d0-4221-96fa-64aa79a47bd1
              categoryId: b1468341-1f30-463f-b22d-7d4a882fa870
              startDate: '2025-11-25T00:00:00'
              endDate: '2025-12-31T23:59:34'
              discount: 55
              active: true
              terms: nuevos terminos y condiciones
        required: true
      description: Partial update with an optimistic-lock style `lastUpdate` check. Only the owner of the campaign business may update it; moving
        the campaign to another business requires owning both. Returns 202 with the new `lastUpdate`; a stale `lastUpdate` is 409.
  /api/v1/favorites/{favoriteId}:
    parameters:
