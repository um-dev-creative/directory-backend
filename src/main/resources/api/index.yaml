openapi: 3.0.0
info:
  title: Directory Site Backend
  version: 1.0.0
  description: 'Directory backend API. All routes live under `/api/v1`.


    - **Authentication:** the `session-token` header. Reads documented as public do not need it.

    - **Rate limiting:** every `/api/v1/**` request is rate limited per client IP and per user. When the limit is exceeded the answer is `429`
    with the `Retry-After` header (seconds) and `X-RateLimit-Limit`.

    - **Errors:** when an endpoint explains a `400`/`5xx`, the reason is in the `message-error` response header.

    - **Documentation endpoints:** Swagger UI and `/v3/api-docs` are only open when `umdc.docs.enabled=true` (dev and test); otherwise they answer
    403. This file is the maintained contract.'
servers:
- url: '{{directoryUrl}}'
paths:
  /api/v1/auth/session-token:
    post:
      summary: Generate Session-Token
      parameters:
      - name: session-token-bkd
        in: header
        schema:
          type: string
        example: '{{backboneSessionToken}}'
      responses:
        '403':
          description: Generate Token
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer error="insufficient_scope", error_description="The request requires higher privileges than provided by the access
                token.", error_uri="https://tools.ietf.org/html/rfc6750#section-3.1"
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
            X-XSS-Protection:
              schema:
                type: integer
              example: '0'
            Cache-Control:
              schema:
                type: string
              example: no-cache, no-store, max-age=0, must-revalidate
            Pragma:
              schema:
                type: string
              example: no-cache
            Expires:
              schema:
                type: integer
              example: '0'
            Strict-Transport-Security:
              schema:
                type: string
              example: max-age=31536000 ; includeSubDomains
            X-Frame-Options:
              schema:
                type: string
              example: DENY
            Content-Length:
              schema:
                type: integer
              example: '0'
            Date:
              schema:
                type: string
              example: Fri, 21 Feb 2025 10:57:06 GMT
            Keep-Alive:
              schema:
                type: string
              example: timeout=60
            Connection:
              schema:
                type: string
              example: keep-alive
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                alias:
                  type: string
                password:
                  type: string
            example:
              alias: amata290839
              password: <password>
  /api/v1/auth/token:
    post:
      summary: Generate Token Manual
      parameters:
      - name: session-token-bkd
        in: header
        schema:
          type: string
        example: eyJhbGciOiJIUzI1NiJ9..kJMgAt7ZYzrJqE0RmDoS2nqJuQKxa-leGN9sXNByP3U
      responses:
        '403':
          description: Generate Token
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer error="insufficient_scope", error_description="The request requires higher privileges than provided by the access
                token.", error_uri="https://tools.ietf.org/html/rfc6750#section-3.1"
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
            X-XSS-Protection:
              schema:
                type: integer
              example: '0'
            Cache-Control:
              schema:
                type: string
              example: no-cache, no-store, max-age=0, must-revalidate
            Pragma:
              schema:
                type: string
              example: no-cache
            Expires:
              schema:
                type: integer
              example: '0'
            Strict-Transport-Security:
              schema:
                type: string
              example: max-age=31536000 ; includeSubDomains
            X-Frame-Options:
              schema:
                type: string
              example: DENY
            Content-Length:
              schema:
                type: integer
              example: '0'
            Date:
              schema:
                type: string
              example: Fri, 21 Feb 2025 10:57:06 GMT
            Keep-Alive:
              schema:
                type: string
              example: timeout=60
            Connection:
              schema:
                type: string
              example: keep-alive
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - auth
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                alias:
                  type: string
                password:
                  type: string
            example:
              alias: bjays-70773
              password: <password>
  /api/v1/businesses:
    post:
      summary: Create Business
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: Required. Without a valid token the answer is 401.
      - name: session-token-bkd
        in: header
        schema:
          type: string
        example: '{{backboneSessionToken}}'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The `userId` of the body is not the user of the token
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - businesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessCreateRequest'
            example:
              name: AADgC23sAq Business
              description: This is an example business description.
              categoryId: 3536c5be-e56a-4a22-8f3c-d36da4a86f61
              userId: 4d411d6a-31ee-4a6d-8660-2d563bfd0d76
              email: contact@example.com
              customerServiceEmail: support@example.com
              orderManagementEmail: orders@example.com
              website: https://www.example.com
        required: true
      description: 'Creates a business owned by the user of the session token. The owner always comes from the token: a `userId` in the body that
        is not the token user is rejected with 403.'
  /api/v1/businesses/{businessId}:
    get:
      summary: Get Business by Id
      parameters:
      - name: session-token
        in: header
        schema:
          type: string
        example: '{{directorySessionTokenName}}'
        required: false
        description: Public read; the token is not needed by this endpoint.
      responses:
        '200':
          description: Business found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - businesses
    parameters:
    - name: businessId
      in: path
      required: true
      schema: &id001
        type: string
        format: uuid
      example: 3c50b50b-d117-44f8-b350-b441518e11c9
    delete:
      summary: Delete Business by business Id and User Id
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Business deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user is not the owner of the business
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - businesses
    patch:
      summary: Update Business
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: Required. Without a valid token the answer is 401.
      - name: session-token-bkd
        in: header
        required: false
        deprecated: false
        schema: {}
        example: '{{backboneSessionToken}}'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user is not the owner of the business
        '404':
          description: Business, category or user not found
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - businesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessUpdateRequest'
            example:
              name: El negocio 1
              description: descripcion del negocio
              categoryId: 3536c5be-e56a-4a22-8f3c-d36da4a86f61
              email: elcorreo@dmain.com
              customerServiceEmail: attention@dmain.com
              orderManagementEmail: manager@dmain.com
              website: www.midominio.com
        required: true
      description: Partial update (only the fields sent change). Only the owner of the business may update it; a referenced category or user that
        does not exist is 404.
  /api/v1/businesses/user/{userId}:
    get:
      summary: Get Business collection by User Id
      parameters:
      - name: session-token
        in: header
        required: false
        schema:
          type: string
        description: Public read; the token is not needed by this endpoint.
      responses:
        '200':
          description: Businesses of the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Business'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - businesses
    parameters:
    - name: userId
      in: path
      required: true
      schema: *id001
      example: 3171803c-bb08-4eb0-8821-b6ebe5948f48
  /api/v1/campaigns:
    post:
      summary: Create Campaign
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: Required. Without a valid token the answer is 401.
      - name: session-token-bkd
        in: header
        required: false
        deprecated: false
        schema: {}
        example: '{{backboneSessionToken}}'
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller does not own the business of the campaign
        '404':
          description: Business or category not found (a business that does not exist was 400 before)
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - campaings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                categoryId:
                  type: string
                businessId:
                  type: string
                discount:
                  type: number
                terms:
                  type: string
                status:
                  type: string
                  description: Ignored, except `DRAFT`. The status is computed from the dates and the `active` flag.
                type:
                  type: string
                  enum: [PROMOTION, EVENT, ANNOUNCEMENT]
                  default: PROMOTION
                  description: Case-insensitive on input. An unknown value is 400.
                active:
                  type: boolean
            example:
              title: A Big Deal
              description: Gran campana
              startDate: '2025-11-25T00:00:00'
              endDate: '2025-12-31T23:59:59'
              categoryId: 0492cf87-dee0-4710-a450-341bd112dea2
              businessId: c2fc43b7-dd6e-42e0-bd1b-9c9e95545190
              discount: 0.26
              terms: Sin definir
              type: PROMOTION
              active: true
        required: true
      description: Creates a campaign. The caller must own the business of the campaign.
    get:
      summary: List Campaign
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sort
        in: query
        schema:
          type: string
          default: -created_date
      - name: active
        in: query
        schema:
          type: boolean
      - name: title
        in: query
        schema:
          type: string
      - name: category_fk
        in: query
        schema: *id001
      - name: business_fk
        in: query
        schema: *id001
      - name: start_from
        in: query
        schema:
          type: string
          format: date-time
      - name: start_to
        in: query
        schema:
          type: string
          format: date-time
      - name: end_from
        in: query
        schema:
          type: string
          format: date-time
      - name: end_to
        in: query
        schema:
          type: string
          format: date-time
      - name: status
        in: query
        schema:
          type: string
          enum: [DRAFT, SCHEDULED, ACTIVE, PAUSED, EXPIRED]
        description: Computed lifecycle status. An unknown value is 400.
      - name: type
        in: query
        schema:
          type: string
          enum: [PROMOTION, EVENT, ANNOUNCEMENT]
        description: Campaign type. An unknown value is 400.
      - name: session-token
        in: header
        required: false
        schema:
          type: string
        description: Optional. Without a valid token only public campaigns are listed (not draft, not expired, active); with the token of the owner
          of a business, that business's own campaigns are included too.
      responses:
        '200':
          description: Page of campaigns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignListResponse'
        '400':
          description: Invalid pagination, sort, filter, `status` or `type`
          headers:
            message-error:
              $ref: '#/components/headers/MessageError'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - campaings
      description: 'Paginated search. page is 1-based (default 1), per_page default 20, max 100. Filters: title, category_fk, business_fk, active,
        start_from/start_to, end_from/end_to; legacy aliases q, category_id, business_id, start_date_*, end_date_* still work. sort: title, start_date,
        end_date, created_date, prefix `-` for descending (default `-created_date`).'
  /api/v1/categories:
    post:
      summary: Create Category
      parameters:
      - name: session-token
        in: header
        required: false
        deprecated: false
        schema: {}
        example: '{{directorySessionTokenName}}'
      - name: session-token-bkd
        in: header
        required: false
        deprecated: false
        schema: {}
        example: '{{backboneSessionToken}}'
      responses:
        '201':
          description: Category created
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Parent category not found
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - categories
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                categoryParentId:
                  type: string
                lastUpdate:
                  type: string
                  format: date-time
                createdDate:
                  type: string
                active:
                  type: boolean
            example:
              name: Living Room Furniture x
              description: Furniture for living rooms
              categoryParentId: 2c483f40-8e5f-4e0d-8323-2189f29d8626
              lastUpdate: '2025-06-26T00:09:07'
              createdDate: '2025-06-26T00:09:07'
              active: true
    get:
      summary: Get Categories
      parameters:
      - name: session-token
        in: header
        schema:
          type: string
        example: '{{directorySessionTokenName}}'
      - name: session-token-bkd
        in: header
        schema:
          type: string
        example: '{{backboneSessionToken}}'
      responses:
        '200':
          description: All categories
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - categories
  /api/v1/categories/{categoryId}:
    get:
      summary: Find Category by ID
      parameters:
      - name: session-token
        in: header
        schema:
          type: string
        example: '{{directorySessionTokenName}}'
      responses:
        '200':
          description: Category found
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - categories
    parameters:
    - name: categoryId
      in: path
      required: true
      schema:
        type: string
      example: 1d175fee-bc94-42d8-9362-79aa0475fe28
  /api/v1/categories/parent/{parentId}:
    get:
      summary: Find Category by parent ID
      parameters:
      - name: session-token
        in: header
        required: false
        deprecated: false
        schema: {}
        example: '{{directorySessionTokenName}}'
      - name: session-token-bkd
        in: header
        required: false
        deprecated: false
        schema: {}
        example: '{{backboneSessionToken}}'
      responses:
        '200':
          description: Child categories
        '400':
          description: Invalid parent id
        '404':
          description: Parent category not found
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - categories
    parameters:
    - name: parentId
      in: path
      required: true
      schema:
        type: string
      example: 0492cf87-dee0-4710-a450-341bd112dea2
  /api/v1/digital-contact:
    get:
      summary: Get Digital Contact
      parameters:
      - name: page
        in: query
        required: false
        deprecated: false
        schema: {}
        example: '0'
      - name: size
        in: query
        required: false
        deprecated: false
        schema: {}
        example: '10'
      - name: session-token
        in: header
        schema:
          type: string
        example: '{{directorySessionTokenName}}'
      responses:
        '200':
          description: Page of digital contacts
        '400':
          description: Invalid pagination parameters
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - digital-contact
  /api/v1/digital-contact/business/{businessId}:
    get:
      summary: Get Digital Contact By Business ID
      parameters:
      - name: session-token
        in: header
        schema:
          type: string
        example: '{{directorySessionTokenName}}'
      responses:
        '200':
          description: Digital contacts of the business
        '400':
          description: Invalid business id
        '404':
          description: No digital contacts found for the business
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - digital-contact
    parameters:
    - name: businessId
      in: path
      required: true
      schema:
        type: string
      example: 1a24da99-78d0-4221-96fa-64aa79a47bd1
  /api/v1/digital-contact/{digitalContactId}:
    get:
      summary: Get Digital Contact By ID
      parameters:
      - name: session-token
        in: header
        schema:
          type: string
        example: '{{directorySessionTokenName}}'
      responses:
        '200':
          description: Digital contact found
        '400':
          description: Invalid id
        '404':
          description: Digital contact not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - digital-contact
    parameters:
    - name: digitalContactId
      in: path
      required: true
      schema:
        type: string
      example: fe5e185c-5525-4155-b361-ce6960525b16
  /api/v1/favorites:
    post:
      summary: Create Favorite
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
      - name: session-token-bkd
        in: header
        schema:
          type: string
        example: '{{backboneSessionToken}}'
      responses:
        '201':
          description: Favorite created or reactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Referenced item not found
        '409':
          description: The user already has an active favorite for that item
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - favorites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteCreateRequest'
            example:
              type: PRODUCT
              itemId: d6919c8c-dc11-4280-a09a-6c3af3fdc443
        required: true
      description: Adds a favorite for the token user. Re-adding a deleted (inactive) favorite reactivates it and answers 201; adding an active
        duplicate answers 409.
    get:
      summary: List the favorites of the user
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
          enum:
          - stores
          - products
          - offers
        description: Optional filter; any other value is 400
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        description: 0-based page; negative values are treated as 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        description: 1 to 100; below 1 is 400, above 100 is capped to 100
      - name: sort
        in: query
        schema:
          type: string
          default: created_at,desc
        description: created_at | createdAt | name, optionally ,asc or ,desc; any other value is 400
      responses:
        '200':
          description: Favorites grouped by type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoritesResponse'
        '400':
          description: Invalid type, sort or size
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - favorites
      description: Active favorites of the token user grouped by type (stores, products, offers). Page is 0-based. `sort` accepts `created_at`
        | `createdAt` | `name`, each optionally with `,asc` or `,desc`; default `created_at,desc`.
  /api/v1/products:
    post:
      summary: Create Product
      parameters:
      - name: session-token
        in: header
        required: true
        schema:
          type: string
        description: Required. Without a valid token the answer is 401.
      - name: session-token-bkd
        in: header
        required: false
        deprecated: false
        schema: {}
        example: '{{backboneSessionToken}}'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user does not own any business, or does not own `businessId`
        '404':
          description: '`businessId` was sent and the business does not exist'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - v1
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
            example:
              name: Example Product AAZ
              description: This is an example product description.
              categoryId: null
              price: 12.5
              currency: USD
              imageRef: products/example.jpg
        required: true
      description: 'Creates an active product. Without `businessId` the caller must own at least one business and the product is not linked (use
        `POST /products/link`). With `businessId` the caller must own that business and the product is linked in the same request.'
